<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Past attempts, SSAT and ISEE practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="wrap narrow">
  <header class="masthead">
    <h1>Past attempts</h1>
    <p>Every finished test is saved in this browser. Export them as one file to send on, or open a
    file someone else sent you.</p>
  </header>

  <section style="margin:2rem 0">
    <label for="who" style="display:block;font-size:0.9rem;color:var(--muted);margin-bottom:0.4rem">
      Whose practice is this? Used in the file name only.</label>
    <input id="who" type="text" placeholder="Rahul"
      style="width:100%;max-width:22rem;padding:0.6rem 0.8rem;border:1px solid var(--line);
      border-radius:6px;font-family:inherit;font-size:1rem;background:var(--slide);color:var(--ink)">
  </section>

  <div style="display:flex;gap:0.6rem;flex-wrap:wrap;margin:1.5rem 0">
    <button class="btn btn-primary" id="exportAll">Export everything</button>
    <button class="btn" id="openFile">Open a results file</button>
    <button class="btn" id="clearAll">Clear this browser</button>
    <a class="btn" href="index.html">All tests</a>
  </div>
  <input type="file" id="picker" accept="application/json,.json" style="display:none">

  <div id="list"></div>
  <div id="viewer"></div>
  <div style="height:4rem"></div>
</div>

<script>
var STORE = "prep:attempts", NAME_KEY = "prep:student";

function load() {
  try { return JSON.parse(localStorage.getItem(STORE) || "[]"); } catch (e) { return []; }
}
function save(all) {
  try { localStorage.setItem(STORE, JSON.stringify(all)); return true; } catch (e) { return false; }
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function mmss(s) {
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function when(iso) {
  var d = new Date(iso);
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) +
    ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function totals(a) {
  var r = 0, w = 0, b = 0, t = 0, sec = 0;
  a.sections.forEach(function (s) { r += s.right; w += s.wrong; b += s.blank; t += s.total; sec += s.seconds; });
  return { right: r, wrong: w, blank: b, total: t, seconds: sec, raw: r - w * (a.wrongPenalty || 0) };
}
function fileFor(a) {
  var who = (a.student || "attempt").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return who + "-" + a.testId + "-" + a.takenAt.slice(0, 10) + ".json";
}
function download(obj, name) {
  var blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function renderAttempt(a, i) {
  var t = totals(a);
  return '<div class="review-item ' + (t.right / t.total >= 0.6 ? "right" : "wrong") + '">' +
    '<div class="verdict">' + esc(a.exam) + " " + esc(a.level) + " &nbsp;·&nbsp; " + when(a.takenAt) + "</div>" +
    "<p class=\"stem\" style=\"margin:0.4rem 0 0.9rem\">" + esc(a.testTitle) + "</p>" +
    a.sections.map(function (s) {
      return '<div class="scoreline"><div class="name">' + esc(s.name) + "</div>" +
        '<div class="val">' + s.right + " / " + s.total + "</div>" +
        '<div class="time">' + mmss(s.seconds) + "</div></div>";
    }).join("") +
    '<p class="why">' + t.right + " right, " + t.wrong + " wrong, " + t.blank + " blank in " +
    mmss(t.seconds) + (a.wrongPenalty ? ". Raw score " + t.raw.toFixed(2) : "") +
    (a.writing && a.writing.words ? ". Writing sample " + a.writing.words + " words." : "") + "</p>" +
    (a.writing && a.writing.text && a.writing.text.trim()
      ? "<details class=\"essay-details\"><summary>Read the writing</summary>" +
        (a.writing.prompt ? '<p class="stem" style="font-size:1rem;margin-top:0.8rem">' + esc(a.writing.prompt) + "</p>" : "") +
        '<div class="essay-view">' + esc(a.writing.text) + "</div></details>"
      : "") +
    '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.9rem">' +
    '<a class="btn btn-primary" data-review href="test.html?id=' + encodeURIComponent(a.testId) +
      "&attempt=" + encodeURIComponent(a.takenAt) + '">Review</a>' +
    '<a class="btn" data-review href="test.html?id=' + encodeURIComponent(a.testId) + '">Retake</a>' +
    '<button class="btn" data-dl="' + i + '">Download</button>' +
    '<button class="btn" data-rm="' + i + '">Delete</button></div>' +
    "</div>";
}

/* One line per test, so repeat sittings read as a trend before the individual attempts below. */
function renderByTest(all) {
  var by = {};
  all.forEach(function (a) { (by[a.testId] = by[a.testId] || []).push(a); });
  var ids = Object.keys(by).filter(function (id) { return by[id].length > 1; });
  if (!ids.length) return "";
  return "<h3 style=\"font-family:var(--serif);font-size:1.3rem;margin:2rem 0 0.4rem\">Across attempts</h3>" +
    '<p class="empty" style="margin-bottom:1rem">Tests taken more than once. SSAT scores are raw, with the quarter point deduction.</p>' +
    '<div class="history" style="margin-bottom:2rem">' + ids.map(function (id) {
      var list = by[id].slice().sort(function (a, b) { return a.takenAt.localeCompare(b.takenAt); });
      var p = list[0].wrongPenalty || 0;
      var val = function (a) { var t = totals(a); return p ? t.raw : t.right; };
      var show = function (v) { return p ? v.toFixed(2) : String(v); };
      var first = val(list[0]), last = val(list[list.length - 1]);
      var best = Math.max.apply(null, list.map(val));
      var total = totals(list[0]).total;
      var trend = last > first ? "up " + show(last - first) : last < first ? "down " + show(first - last) : "level";
      return '<div class="history-row"><span class="when">' + esc(list[0].exam) + " " + esc(list[0].testTitle) + "</span>" +
        '<span class="bar"><span style="width:' + Math.round((totals(list[list.length - 1]).right / total) * 100) + '%"></span></span>' +
        '<span class="score">' + show(last) + " / " + total + "</span>" +
        '<span class="time">best ' + show(best) + ", " + trend + " over " + list.length + " sittings</span>" +
        '<a class="btn-quiet" href="test.html?id=' + encodeURIComponent(id) + "&attempt=" +
        encodeURIComponent(list[list.length - 1].takenAt) + '">Review latest</a></div>';
    }).join("") + "</div>";
}

function draw() {
  var all = load();
  var el = document.getElementById("list");
  if (!all.length) {
    el.innerHTML = '<p class="empty">Nothing saved in this browser yet. Finish a test and it will ' +
      'appear here, or open a results file someone sent you.</p>';
    return;
  }
  all.sort(function (a, b) { return b.takenAt.localeCompare(a.takenAt); });
  el.innerHTML = renderByTest(all) +
    "<h3 style=\"font-family:var(--serif);font-size:1.3rem;margin-bottom:1rem\">" +
    all.length + (all.length === 1 ? " attempt" : " attempts") + "</h3>" +
    all.map(renderAttempt).join("");

  el.querySelectorAll("[data-dl]").forEach(function (b) {
    b.onclick = function () {
      var a = load().sort(function (x, y) { return y.takenAt.localeCompare(x.takenAt); })[+b.dataset.dl];
      download(a, fileFor(a));
    };
  });
  el.querySelectorAll("[data-rm]").forEach(function (b) {
    b.onclick = function () {
      var sorted = load().sort(function (x, y) { return y.takenAt.localeCompare(x.takenAt); });
      var gone = sorted[+b.dataset.rm];
      if (!confirm("Delete the " + gone.testTitle + " attempt from " + when(gone.takenAt) + "?")) return;
      sorted.splice(+b.dataset.rm, 1);
      save(sorted);
      draw();
    };
  });
}

var who = document.getElementById("who");
try { who.value = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}
who.oninput = function () {
  try { localStorage.setItem(NAME_KEY, who.value.trim()); } catch (e) {}
};

document.getElementById("exportAll").onclick = function () {
  var all = load();
  if (!all.length) { alert("Nothing to export yet."); return; }
  var name = (who.value.trim() || "attempts").toLowerCase().replace(/[^a-z0-9]+/g, "-");
  download({ student: who.value.trim(), exported: new Date().toISOString(), attempts: all },
    name + "-all-attempts-" + new Date().toISOString().slice(0, 10) + ".json");
};

document.getElementById("clearAll").onclick = function () {
  var all = load();
  if (!all.length) { alert("Nothing saved in this browser."); return; }
  if (!confirm("Delete all " + all.length + " saved attempts from this browser? Export them first if you want to keep them.")) return;
  save([]);
  // Unfinished sittings go too, so nothing offers to resume into a cleared history.
  try {
    var gone = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("prep:snapshot:") === 0) gone.push(k);
    }
    gone.forEach(function (k) { localStorage.removeItem(k); });
  } catch (e) {}
  draw();
};

document.getElementById("openFile").onclick = function () { document.getElementById("picker").click(); };
document.getElementById("picker").onchange = function (e) {
  var f = e.target.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    var data;
    try { data = JSON.parse(reader.result); }
    catch (err) {
      document.getElementById("viewer").innerHTML =
        '<p class="rule warn">That file is not readable JSON, so nothing was opened.</p>';
      return;
    }
    var list = Array.isArray(data) ? data : data.attempts ? data.attempts : [data];
    list = list.filter(function (a) { return a && a.testId && a.takenAt && Array.isArray(a.sections); });
    if (!list.length) {
      document.getElementById("viewer").innerHTML =
        '<p class="rule warn">That file does not contain any attempts, so nothing was opened.</p>';
      return;
    }
    // Attempts already in this browser are matched by test and time taken, so importing the same
    // file twice adds nothing.
    var have = {};
    load().forEach(function (a) { have[a.testId + "|" + a.takenAt] = true; });
    var fresh = list.filter(function (a) { return !have[a.testId + "|" + a.takenAt]; });
    document.getElementById("viewer").innerHTML =
      "<h3 style=\"font-family:var(--serif);font-size:1.3rem;margin:2.5rem 0 0.4rem\">From " +
      esc(f.name) + "</h3><p class=\"empty\" style=\"margin-bottom:1rem\">Viewing only. Nothing " +
      "from this file is added to this browser unless you press the button below.</p>" +
      '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin:0 0 1.25rem">' +
      (fresh.length
        ? '<button class="btn btn-primary" id="importAll">Add ' + fresh.length +
          (fresh.length === 1 ? " attempt" : " attempts") + " to this browser</button>"
        : '<span class="empty">Every attempt in this file is already saved here.</span>') +
      "</div>" + list.map(renderAttempt).join("");
    // A file from another device cannot be reviewed here until it is added, since review reads the
    // answers from this browser.
    document.getElementById("viewer").querySelectorAll("[data-dl],[data-rm],[data-review]").forEach(function (b) {
      b.remove();
    });
    var imp = document.getElementById("importAll");
    if (imp) imp.onclick = function () {
      var all = load().concat(fresh);
      if (!save(all)) { alert("This browser would not save the attempts. Private windows often refuse."); return; }
      document.getElementById("viewer").innerHTML = "";
      draw();
      window.scrollTo(0, 0);
    };
  };
  reader.readAsText(f);
  e.target.value = "";
};

draw();
</script>

</body>
</html>
